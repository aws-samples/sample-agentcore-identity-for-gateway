<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">

<title>共享基础（Cognito + IAM Identity Center 方案）</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16191f;--mut:#5f6b7a;--line:#e3e6ea;--acc:#0972d3;--ms:#0067b8;--ok:#037f0c;--okb:#e9f7ea;--no:#c0262d;--nob:#fdecec;--warn:#8a5a00;--warnb:#fff6e0;--code:#0f1b2a}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.banner{background:#232f3e;color:#fff;padding:8px 20px;font-size:13px;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:5}
.banner b{color:#ff9900}
.wrap{display:flex;min-height:calc(100vh - 38px)}
nav{width:230px;flex:none;background:#fff;border-right:1px solid var(--line);padding:18px 0;position:sticky;top:38px;height:calc(100vh - 38px)}
nav h1{font-size:15px;margin:0 18px 4px}nav .sub{font-size:12px;color:var(--mut);margin:0 18px 16px}
nav a{display:block;padding:9px 18px;color:var(--ink);text-decoration:none;border-left:3px solid transparent;cursor:pointer}
nav a.on{border-left-color:var(--acc);background:#f0f6fc;color:var(--acc);font-weight:600}
nav .meta{position:absolute;bottom:14px;left:18px;right:12px;font-size:11px;color:var(--mut)}
main{flex:1;min-width:0;padding:22px 28px 60px;max-width:1240px}
section{display:none}section.on{display:block}
.arch img{display:block;width:100%;height:auto}
h2{margin:0 0 4px;font-size:22px}h3{margin:18px 0 8px;font-size:16px}.lead{color:var(--mut);margin:0 0 16px;max-width:900px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px}.grid>*{min-width:0}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g2,.g3,.g4{grid-template-columns:1fr}nav{display:none}}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
:not(pre)>code{background:#eef1f4;padding:1px 5px;border-radius:4px;word-break:break-all}
pre{margin:0;background:var(--code);color:#d7e2ee;border-radius:8px;padding:10px 0;overflow:auto;font-size:12px;line-height:1.55}
pre .ln{display:inline-block;width:42px;text-align:right;padding-right:12px;color:#6b7c8f;user-select:none}
pre .row{white-space:pre;padding-right:14px}pre .gap{color:#6b7c8f;padding-left:54px}
pre.out{padding:10px 14px;white-space:pre-wrap;word-break:break-all}
.ref{font-size:12px;color:var(--mut);margin:10px 0 4px}.ref b{color:var(--ink)}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{font-size:12px;color:var(--mut);font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600}
.ok{background:var(--okb);color:var(--ok)}.no{background:var(--nob);color:var(--no)}.warn{background:var(--warnb);color:var(--warn)}.mut{background:#eef1f4;color:var(--mut)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.on{border-color:var(--acc);background:#f0f6fc;color:var(--acc);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.foot{margin-top:18px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--mut)}
/* replay */
.steps{display:flex;gap:6px;margin-bottom:14px}.steps span{flex:1;text-align:center;padding:6px;border-radius:6px;background:#eef1f4;color:var(--mut);font-size:12px}.steps span.on{background:var(--acc);color:#fff}
.ms{max-width:420px;margin:10px auto;border:1px solid var(--line);border-radius:6px;padding:30px 36px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.ms .logo{display:flex;gap:2px;width:22px;flex-wrap:wrap;margin-bottom:14px}.ms .logo i{width:10px;height:10px;display:block}
.ms h4{font-size:22px;font-weight:600;margin:0 0 12px}.ms input{width:100%;border:0;border-bottom:1px solid #666;padding:8px 2px;font:inherit;margin-bottom:12px;outline:none}
.ms input:focus{border-bottom-color:var(--ms)}.ms .who{display:flex;gap:6px;margin-bottom:12px}
.ms .go{background:var(--ms);color:#fff;border:0;padding:7px 26px;float:right;cursor:pointer;font:inherit}
.ms small{display:block;color:var(--mut);clear:both;padding-top:14px}
.claims td:first-child{font-family:ui-monospace,Menlo,monospace;width:170px}
.quick{display:grid;grid-template-columns:1fr 330px;gap:14px}@media(max-width:1000px){.quick{grid-template-columns:1fr}}
.chat{background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;height:560px}
.chat .hd{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.chat .bd{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fafbfc}
.chat .ft{padding:10px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px}.msg.u{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}
.msg .tc{font-size:12px;color:var(--mut);margin-bottom:4px}.msg pre.out{margin-top:6px;background:#f3f5f7;color:#222}
.conn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.conn .t{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-family:ui-monospace,Menlo,monospace;font-size:12px}
.conn .t.off{color:#a0a9b4;text-decoration:line-through}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
/* flows */
.flow{display:flex;align-items:stretch;gap:0;margin:8px 0 16px;overflow-x:auto}
.node{flex:1;min-width:150px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;position:relative;transition:.15s}
.node .n{font-size:11px;color:var(--mut)}.node .t{font-weight:600;font-size:13px}.node .s{font-size:12px;color:var(--mut)}
.node.on{border-color:var(--acc);box-shadow:0 0 0 3px #d6e8fa}.node.bad{border-color:var(--no)}.node.good{border-color:var(--ok)}
.arrow{flex:none;width:26px;display:flex;align-items:center;justify-content:center;color:#9aa5b1;font-size:18px}
.opt{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.opt h4{margin:0 0 6px;font-size:14px}
.opt.best{border-color:var(--ok);background:#f6fcf6}
.err{font-family:ui-monospace,Menlo,monospace;background:var(--nob);color:var(--no);padding:10px 12px;border-radius:8px;border:1px solid #f3c2c4}
.kv td:first-child{width:220px;color:var(--mut)}
.hop-hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.who-chk{font-size:12px}
.checks li{margin:4px 0}
/* 2026-10-30 evidence + FAQ */
.ev{background:var(--okb);border:1px solid #bfe3c2;border-radius:8px;padding:7px 10px;margin:8px 0;font-size:13px}
details.faq{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
details.faq>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:baseline}
details.faq>summary::-webkit-details-marker{display:none}details.faq>summary:before{content:"▸";color:var(--acc)}details.faq[open]>summary:before{content:"▾"}
details.faq[open]{border-color:var(--acc)}details.faq .bd{padding:0 16px 12px 36px}
.qa{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;margin:0}.qa dt{font-size:12px;font-weight:600;padding-top:2px}.qa dd{margin:0}
.qa dt.w{color:var(--no)}.qa dt.y{color:var(--mut)}.qa dt.f{color:var(--ok)}.qa dt.v{color:var(--acc)}
details.sc{background:#fff;border:1px solid var(--line);border-radius:8px;margin:8px 0}details.sc>summary{cursor:pointer;padding:9px 12px;font-size:13px;color:var(--acc);font-weight:600}
details.sc[open]{border-color:var(--acc)}details.sc .b{padding:0 12px 12px}details.sc img{max-width:100%;display:block;border:1px solid var(--line);border-radius:6px}
.seq{display:flex;flex-wrap:wrap;gap:4px;align-items:stretch;margin:6px 0}.seq div{background:#f0f6fc;border:1px solid #c9dff3;border-radius:6px;padding:5px 8px;font-size:12px;max-width:210px}
.seq div.edge{background:var(--okb);border-color:#bfe3c2}.seq span{align-self:center;color:#9aa5b1}
details.faq .docs{border-top:1px dashed var(--line);margin-top:12px;padding-top:8px;font-size:13px}details.faq .docs ul{margin:4px 0 0;padding-left:18px}
.toggle{border:1px dashed var(--no);border-radius:8px;padding:10px 12px;margin:10px 0;background:#fffafa}
.chk label{display:block;padding:5px 0;border-bottom:1px solid var(--line);cursor:pointer}.chk input{margin-right:8px}
nav{overflow:auto}nav .meta{position:static;margin:16px 18px 0;line-height:1.9}nav .meta a{display:inline;padding:0;border:0;color:var(--acc)}
.start{border:2px solid var(--acc);background:#f0f6fc}.start h3{margin-top:0}
.arch2 img{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
details.faq summary .res{margin-left:auto;font-weight:400;font-size:12px;color:var(--mut)}
details.faq .bd p{margin:8px 0}details.faq .bd ul{margin:6px 0;padding-left:20px}details.faq .bd pre{margin:8px 0}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}@media(max-width:1000px){.dgrid{grid-template-columns:1fr}}
</style></head>

<script>
// Renders page-built markup without innerHTML: parse, drop active content, insert nodes. Data values are escaped by esc() at the call sites.
function safeRender(el, html, append) {
  const svg = el instanceof SVGElement;
  const doc = new DOMParser().parseFromString(svg ? `<svg xmlns="http://www.w3.org/2000/svg">${html}</svg>` : "<body>" + html, "text/html");
  doc.querySelectorAll("script,iframe,object,embed,link,meta,base,form").forEach(n => n.remove());
  doc.querySelectorAll("*").forEach(n => [...n.attributes].forEach(a => {
    const v = a.value.trim().toLowerCase();
    if (a.name.startsWith("on") || ((a.name === "href" || a.name === "src" || a.name === "xlink:href") && v.startsWith("javascript:"))) n.removeAttribute(a.name);
  }));
  const nodes = svg ? [...doc.querySelector("svg").childNodes] : [...doc.body.childNodes];
  append ? el.append(...nodes) : el.replaceChildren(...nodes);
}
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
// tiny markdown: `code`, **bold**, [text](url) for relative or https links only
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
  .replace(/\[([^\]]+)\]\(((?:https:\/\/|\.\.?\/|#|[a-z0-9-]+\.html)[^)]*)\)/g, '<a href="$2">$1</a>');

function go(sec, anchor) {
  document.querySelectorAll("nav a[data-s]").forEach(x => x.classList.toggle("on", x.dataset.s === sec));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === sec));
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav a[data-s]").forEach(a => a.onclick = () => { go(a.dataset.s); history.replaceState(null, "", "#" + a.dataset.s); });
// in-page links like #webgui switch sections
document.addEventListener("click", e => {
  const a = e.target.closest("main a[href^='#']"); if (!a) return;
  const id = a.getAttribute("href").slice(1); if ($("section#" + id)) { e.preventDefault(); go(id); }
});

    <div class="ref"><a href="${f}" target="_blank" rel="noopener">查看大图</a> · 控制台：<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a> （截取于 ${esc(x.at)}）</div></div></details>`;
}

  switch (b.t) {
    case "p": return `<p>${md(b.x)}</p>`;
    case "code": return `<pre class="out">${esc(b.x)}</pre>`;
    case "res": return `<div class="ref"><b>记录的结果</b></div><pre class="out">${esc(b.x)}</pre>`;
    case "list": return `<ul>${b.x.map(i => `<li>${md(i)}</li>`).join("")}</ul>`;
    case "table": return `<table><tr>${b.h.map(h => `<th>${esc(h)}</th>`).join("")}</tr>${b.r.map(r => `<tr>${r.map(c => `<td>${md(c)}</td>`).join("")}</tr>`).join("")}</table>`;
    case "shots": return b.f.map(screenCard).join("");
  }
  return "";
}

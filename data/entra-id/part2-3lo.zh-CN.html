oken: <inbound token>})`。调用方需要对 workload identity 和 provider 拥有 `bedrock-agentcore:CompleteResourceTokenAuth` 权限。", "verified": "已记录用例 3：无异常；随后用例 4 返回 `TOKEN_FROM_VAULT`。", "x": ["ea_cb"], "docs": [["AgentCore Identity · OAuth 2.0 授权 URL 会话绑定（session binding）", "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/oauth2-authorization-url-session-binding.html"], ["AgentCore API · CompleteResourceTokenAuth", "https://docs.aws.amazon.com/bedrock-agentcore/latest/APIReference/API_CompleteResourceTokenAuth.html"], ["AgentCore Identity · 获取 OAuth 2.0 access token", "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity-authentication.html"], ["RFC 9700 · OAuth 2.0 安全最佳当前实践（Security BCP）", "https://datatracker.ietf.org/doc/html/rfc9700"]]}, {"q": "为什么 AgentCore 的 authorize 页面返回 \"Invalid request\"（请求无效）？", "wrong": "AgentCore 托管的 `/identities/oauth2/authorize?request_uri=…` 显示 `Invalid request`（请求无效），Entra 登录始终没有开始。", "why": "`request_uri` 是**一次性**的（与 RFC 9126 pushed authorization requests 的思路相同）。第二次加载（刷新、预取，或在一步中同时启动浏览器并导航的自动化脚本）会被拒绝。", "fix": "`authorizationUrl` 只加载一次；在浏览器自动化中先打开 `about:blank`，再导航过去。如果它已被使用过，就再向 agent 请求一个新的 `authorizationUrl`。", "verified": "记录于 2026-10-19：只加载一次时，consent URL 第一次就成功（consent URL 重试次数 = 0）。", "x": ["t_requri"], "docs": [["RFC 9126 · OAuth 2.0 Pushed Authorization Requests（request_uri）", "https://datatracker.ietf.org/doc/html/rfc9126"], ["AgentCore Identity · OAuth 2.0 授权 URL 会话绑定（session binding）", "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/oauth2-authorization-url-session-binding.html"], ["AgentCore API · GetResourceOauth2Token", "https://docs.aws.amazon.com/bedrock-agentcore/latest/APIReference/API_GetResourceOauth2Token.html"]]}, {"q": "为什么交互式登录停在 \"Let's keep your account secure\"？", "wrong": "交互式 Entra 登录（LOGIN 1 和 LOGIN 2）显示 “Let's keep your account secure”（保护你的帐户安全），并且没有 “Skip for now”（暂时跳过）选项。", "why": "租户启用了 **Security defaults**：注册宽限期结束后，每个用户在交互式登录时都必须注册 MFA。3LO 同意在设计上就是交互式的。非交互式 token 流程（ROPC，用于脚本化的 2LO / OBO 测试）不会出现此页面。", "fix": "每个交互式用户注册一次身份验证方式（这里 lo3user 使用可生成 TOTP 验证码的 authenticator app）。需要更精细控制的组织可以改用 Conditional Access 来代替 Security defaults。", "verified": "记录于 2026-10-19（测试）和 2026-10-20（GUI）：lo3user 使用 authenticator 验证码登录；5/5 PASS。", "x": ["t_mfa"], "docs": [["Microsoft Entra · 安全默认值（security defaults）", "https://learn.microsoft.com/en-us/entra/fundamentals/security-defaults"], ["Microsoft Entra · Authenticator app（TOTP 验证码）", "https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-authenticator-app"], ["Microsoft Entra · 授权码流程（PKCE）", "https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-auth-code-flow"]]}, {"q": "为什么用户没有看到 Microsoft 的同意提示？", "why": "agent app 的 Graph 委托权限（User.Read、openid、profile、offline_access）已**为所有用户授予管理员同意**（consentType 为 AllPrincipals 的 `oauth2PermissionGrant`）。同意已存在时 Entra 会跳过提示；否则用户会看到权限页面（前提是租户的用户同意设置允许）。", "fix": "在 app 的 API permissions 上授予管理员同意（见「配置」中的截图），或在租户策略允许的情况下由用户自行同意。", "verified": "已记录：LOGIN 2 从登录（+MFA）直接跳转到 AgentCore callback。", "x": ["i19_grant"], "docs": [["Microsoft Entra · 授予租户范围的管理员同意", "https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/grant-admin-consent"], ["Microsoft Entra · 同意体验类型", "https://learn.microsoft.com/en-us/entra/identity-platform/consent-types-developer"], ["Microsoft Entra · scope、权限与同意", "https://learn.microsoft.com/en-us/entra/identity-platform/scopes-oidc"], ["Microsoft Graph · 权限参考（User.Read）", "https://learn.microsoft.com/en-us/graph/permissions-reference"]]}, {"q": "为什么另一个用户（wei）不能使用 lo3user 的 token？", "why": "Runtime 根据 **inbound JWT** 派生 workload access token，因此它绑定到 (agent, 调用方)。Token Vault 也以同一对值为键：wei 的调用查的是 wei 的槽位，该槽位为空，所以即使 lo3user 已经同意，wei 仍然得到 `CONSENT_REQUIRED`。", "fix": "无需处理：按用户隔离是内置能力。每个用户为自己同意一次即可。", "verified": "已记录用例 5：wei → `CONSENT_REQUIRED`。", "x": ["t_bind"], "docs": [["AgentCore Identity · 概述", "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity.html"], ["AgentCore Identity · 功能特性（token vault）", "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/key-features-and-benefits.html"], ["AgentCore API · GetWorkloadAccessTokenForJWT", "https://docs.aws.amazon.com/bedrock-agentcore/latest/APIReference/API_GetWorkloadAccessTokenForJWT.html"], ["AgentCore · inbound 与 outbound 认证（Runtime JWT authorizer）", "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-oauth.html"]]}, {"q": "为什么 agent 要把 Graph /me 与 inbound token 进行比对（身份校验）？", "why": "纵深防御：来自 vault 的委托 token 必须属于**正在调用 agent 的那个人**。Agent 从 Graph `/me` 读取 `userPrincipalName`，并与 inbound token 中的 `preferred_username` 比对；若不一致，则返回 `IDENTITY_MISMATCH`，且不返回任何数据。", "fix": "把 `Authorization` header 转发给 agent（`requestHeaderAllowlist = [Authorization]`），使其能读取调用方的 claims；runtime 已经校验过该 token。", "verified": "已记录用例 4：Graph `/me` 的 userPrincipalName = lo3user = inbound preferred_username。", "x": ["mp_3lo"], "docs": [["Microsoft Graph · 获取用户（/me）", "https://learn.microsoft.com/en-us/graph/api/user-get"], ["Microsoft Entra · access token（v1 / v2、aud、iss）", "https://learn.microsoft.com/en-us/entra/identity-platform/access-tokens"], ["AgentCore · inbound 与 outbound 认证（Runtime JWT authorizer）", "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-oauth.html"]]}, {"q": "Runtime 如何校验用户的 Entra token？为什么要用 v2 token？", "why": "Runtime 的 `customJWTAuthorizer` 使用租户的 **v2** discovery 文档（issuer `https://login.microsoftonline.com/<tenant>/v2.0`、JWKS），并设置 `allowedAudience = [<rsidc-entra-agent appId>]`。除非 API app 设置了 `requestedAccessTokenVersion = 2`，否则 Entra 签发的是 **v1** token（issuer `https://sts.windows.net/<tenant>/`），而 v1 issuer 与 v2 discovery 文档不匹配。", "fix": "在 agent 的 app 上设置 `api.requestedAccessTokenVersion = 2`，并为 authorizer 配置 v2 discovery URL，以 app ID 作为 audience。", "verified": "已记录：inbound token `ver = 2.0`，`aud` = rsidc-entra-agent 的 app ID，被 runtime 接受（全部 5 个用例）。", "x": ["i20_rt", "i19_app"], "docs": [["AgentCore · inbound 与 outbound 认证（Runtime JWT authoriz ns → rsidc-entra-agent → Authentication 中，AgentCore callback URL 显示为 Web redirect（见「Entra 管理中心」截图）。"], "steps": {"33": {"caption": "App 认证（通过 IdP 获取 JWT）", "built": "用户获取面向 agent API 的 Entra v2 token：`aud = rsidc-entra-agent ({entra-agent-app-id})`，`scp = access_as_user`"}, "34": {"caption": "Runtime authorizer 校验 JWT", "built": "Runtime `rsidc_entra_agent`（`{entra-runtime-id}`）：`customJWTAuthorizer` 使用 Entra v2 discovery URL，`allowedAudience = [{entra-agent-app-id}]`"}, "35": {"caption": "Runtime 获取 WAT（agent + user）", "built": "Runtime 注入绑定到 (rsidc_entra_agent, 该用户) 的 workload access token"}, "36": {"caption": "Agent 向 Credential Provider 出示 WAT", "built": "`GetResourceOauth2Token(oauth2Flow=USER_FEDERATION, provider=rsidc-entra, scopes=[User.Read, offline_access], resourceOauth2ReturnUrl=http://localhost:8765/callback)`"}, "37": {"caption": "3LO：用户通过浏览器同意", "built": "AgentCore 返回 `authorizationUrl` + `sessionUri` → 用户登录 Entra（User.Read 已由管理员授予同意）→ Entra → AgentCore callback（`https://bedrock-agentcore.ap-southeast-1.amazonaws.com/identities/oauth2/callback/{entra-callback-id}`，已在 rsidc-entra-agent 上注册为 web redirect）→ 带 `session_id` 重定向到 return URL → app 调用 `CompleteResourceTokenAuth(sessionUri, userToken = 用户的 inbound Entra token)`（session binding）"}, "38": {"caption": "Token Vault 中的资源 token", "built": "按 (agent, user) 存储；未同意的第 2 个用户（wei）仍然得到 `CONSENT_REQUIRED`"}, "39": {"caption": "Agent 调用外部资源", "built": "用 vault token 调用 `GET https://graph.microsoft.com/v1.0/me`。身份校验（identity guard）：Graph `userPrincipalName` 必须等于 inbound `preferred_username`，否则返回 `IDENTITY_MISMATCH`"}}, "x": {"mp_claims": {"file": "agents/entra-id/main.py", "start": 23, "end": 28, "code": "KEEP = (\"ver\", \"iss\", \"aud\", \"azp\", \"appid\", \"idtyp\", \"scp\", \"roles\", \"preferred_username\", \"upn\", \"name\", \"oid\", \"sub\")\n\n\ndef claims(jwt: str) -> dict:\n    c = json.loads(base64.urlsafe_b64decode(jwt.split(\".\")[1] + \"==\"))\n    return {k: c[k] for k in KEEP if k in c}"}, "mp_token": {"file": "agents/entra-id/main.py", "start": 59, "end": 61, "code": "def token(wat: str, flow: str, scopes: list[str], **extra) -> dict:\n    return identity.get_resource_oauth2_token(workloadIdentityToken=wat, resourceCredentialProviderName=CP,\n                                              scopes=scopes, oauth2Flow=flow, **extra)"}, "mp_3lo": {"file": "agents/entra-id/main.py", "start": 80, "end": 91, "code": "def three_lo(wat, payload, caller):\n    args = dict(resourceOauth2ReturnUrl=payload[\"return_url\"], forceAuthentication=bool(payload.get(\"force\")))\n    if payload.get(\"session_uri\"): args[\"sessionUri\"] = payload[\"session_uri\"]\n    r = token(wat, \"USER_FEDERATION\", [\"User.Read\", \"offline_access\"], **args)\n    if not r.get(\"accessToken\"):\n        return {\"flow\": \"3LO\", \"status\": \"CONSENT_REQUIRED\", \"authorizationUrl\": r.get(\"authorizationUrl\"), \"sessionUri\": r.get(\"sessionUri\")}\n    s, me = http_json(\"https://graph.microsoft.com/v1.0/me\", r[\"accessToken\"])\n    upn = (me.get(\"userPrincipalName\") or \"\").lower()\n    if not caller or upn != caller.lower():   # the vault token must belong to the person calling the agent\n        return {\"flow\": \"3LO\", \"status\": \"IDENTITY_MISMATCH\", \"caller\": caller, \"vault_token_user\": upn}\n    return {\"flow\": \"3LO\", \"status\": \"TOKEN_FROM_VAULT\", \"graph_http\": s,\n            \"me\": {k: me.get(k) for k in (\"displayName\", \"userPrincipalName\", \"id\")}}"}, "mp_entry": {"file": "agents/entra-id/main.py", "start": 94, "end": 107, "code": "@app.entrypoint\ndef invoke(payload, context):\n    wat = BedrockAgentCoreContext.get_workload_access_token()\n    if not wat:\n        return {\"error\": \"no workload access token (inbound JWT required)\"}\n    auth = {k.lower(): v for k, v in (context.request_headers or {}).items()}.get(\"authorization\", \"\")\n    inbound = claims(auth.split(\" \", 1)[1]) if auth.lower().startswith(\"bearer \") else {}\n    mode = payload.get(\"mode\")\n    try:\n        if mode == \"whoami\": return {\"flow\": \"inbound\", \"inbound_token_claims\": inbound}\n        if mode == \"2lo\": return two_lo(wat)\n        if mode == \"obo\": return obo(wat)\n        if mode == \"obo_graph\": return obo_graph(wat)\n        if mode == \"3lo\": return three_lo(wat, payload, inbound.get(\"preferred_username\"))"}, "ea_const": {"file": "webchat/entra-id/entra_app.py", "start": 16, "end": 23, "code": "TENANT, CLIENT, AGENT, RT = (os.environ[k] for k in (\"ENTRA_TENANT_ID\", \"ENTRA_CLIENT_ID\", \"ENTRA_AGENT_APP_ID\", \"ENTRA_RT_ARN\"))\nBASE = os.environ.get(\"WEB_BASE_URL\", \"http://localhost:8083\")\nREDIRECT, SIGNED_OUT, RETURN_3LO = f\"{BASE}/entra/callback\", f\"{BASE}/entra/signed-out\", f\"{BASE}/3lo/callback\"\nAUTHORITY = f\"https://login.microsoftonline.com/{TENANT}/oauth2/v2.0\"\nSCOPE = f\"openid profile offline_access api://{AGENT}/access_as_user\"\nKEEP = (\"ver\", \"iss\", \"aud\", \"azp\", \"scp\", \"roles\", \"preferred_username\", \"name\")\n# Session binding (3LO) is the APP's job: Lambda execution role locally = operator credentials.\nident = boto3.client(\"bedrock-agentcore\", region_name=os.environ[\"RT_REGION\"])"}, "ea_agent": {"file": "webchat/entra-id/entra_app.py", "start": 37, "end": 39, "code": "def agent(s, payload):\n    status, body = invoke(s[\"token\"], payload, runtime_arn=RT, session_id=f\"rsidc-web-entra-{payload['mode']}-{uuid.uuid4()}\")\n    return {\"http\": status, **(body if isinstance(body, dict) else {\"raw\": str(body)[:200]})}"}, "ea_login": {"file": "webchat/entra-id/entra_app.py", "start": 60, "end": 65, "code": "        if u.path == \"/entra/login\":\n            verifier, state = secrets.token_urlsafe(48), secrets.token_urlsafe(16); PENDING[state] = verifier\n            ch = base64.urlsafe_b64encode(hashlib.sha256(verifier.encode()).digest()).decode().rstrip(\"=\")\n            p = dict(response_type=\"code\", client_id=CLIENT, redirect_uri=REDIRECT, scope=SCOPE, state=state, prompt=\"login\",\n                     code_challenge=ch, code_challenge_method=\"S256\")\n            return self.send(302, headers=[(\"Location\", f\"{AUTHORITY}/authorize?{urllib.parse.urlencode(p)}\")])"}, "ea_signin": {"file": "webchat/entra-id/entra_app.py", "start": 66, "end": 78, "code": "        if u.path == \"/entra/callback\":\n            verifier = PENDING.pop(q.get(\"state\", [\"\"])[0], None)\n            if not verifier or \"code\" not in q:\n                return self.send(400, f\"Entra sign-in failed: {esc(q.get('error_description', ['state mismatch'])[0])} <a href='/'>Back</a>\")\n            resp = requests.post(f\"{AUTHORITY}/token\", timeout=15, data=dict(grant_type=\"authorization_code\", client_id=CLIENT,\n                                 code=q[\"code\"][0], redirect_uri=REDIRECT, code_verifier=verifier, scope=SCOPE))\n            r = resp.json()  # Entra returns the error code and description as JSON on 4xx\n            if not resp.ok: return self.send(400, f\"Entra token error: {esc(r.get('error', ''))} <a href='/'>Back</a>\")\n            idc = json.loads(base64.urlsafe_b64decode(r[\"id_token\"].split(\".\")[1] + \"==\")) if r.get(\"id_token\") else {}\n            inbound = claims(r[\"access_token\"]); sid = secrets.token_urlsafe(24)\n            SESSIONS[sid] = {\"token\": r[\"access_token\"], \"login_hint\": idc.get(\"login_hint\"), \"inbound\": inbound,\n                             \"user\": inbound.get(\"preferred_username\", \"?\")}\n            return self.send(302, headers=[(\"Location\", \"/\"), (\"Set-Cookie\", cookie(\"esid\", sid, BASE))])"}, "ea_start": {"file": "webchat/entra-id/entra_app.py", "start": 85, "end": 92, "code": "        if u.path == \"/3lo/start\" and s:  # ask the agent; consent needed -> send the browser to the authorizationUrl (LOGIN 2)\n            r = agent(s, {\"mode\": \"3lo\", \"return_url\": RETURN_3LO, \"force\": q.get(\"force\") == [\"1\"]})\n            if r.get(\"status\") == \"CONSENT_REQUIRED\" and r.get(\"authorizationUrl\"):\n                s[\"pending_session_uri\"], s[\"pending_at\"] = r.get(\"sessionUri\"), time.time()\n                s[\"last3lo\"] = {\"step\": \"redirected to Entra consent\", \"agent\": {k: v for k, v in r.items() if k != \"authorizationUrl\"}}\n                return self.send(302, headers=[(\"Location\", r[\"authorizationUrl\"])])\n            s[\"last3lo\"] = {\"step\": \"token already in the vault\", \"agent\": r}\n            return self.send(302, headers=[(\"Location\", \"/#p3lo\")])"}, "ea_cb": {"file": "webchat/entra-id/entra_app.py", "start": 93, "end": 107, "code": "        if u.path == \"/3lo/callback\" and s:  # AgentCore Identity redirects here after consent -> bind the session to THIS user\n            session_uri = q.get(\"session_id\", [\"\"])[0]\n            pending = take_pending_3lo(s)  # one-time: cleared whether or not it matches\n            if not pending or session_uri != pending:  # not the session THIS browser session started: fail closed\n                s[\"last3lo\"] = {\"step\": \"callback rejected\", \"binding\": {\"matchesPending\": False}}\n                return self.send(400, \"3LO callback does not match a consent started in this session. <a href='/'>Back</a>\")\n            bind = {\"matchesPending\": True}\n            try:\n                ident.complete_resource_token_auth(sessionUri=session_uri, userIdentifier={\"userToken\": s[\"token\"]})\n                bind[\"CompleteResourceTokenAuth\"] = \"OK (bound to the signed-in Entra user)\"\n            except Exception as e:\n                bind[\"CompleteResourceTokenAuth\"] = f\"{type(e).__name__}: {e}\"\n            r = agent(s, {\"mode\": \"3lo\", \"return_url\": RETURN_3LO, \"session_uri\": session_uri})\n            s[\"last3lo\"] = {\"step\": \"consent completed\", \"binding\": bind, \"agent\": r}\n            return self.send(302, headers=[(\"Location\", \"/#p3lo\")])"}, "ea_post": {"file": "webchat/entra-id/entra_app.py", "start": 111, "end": 118, "code": "    def do_POST(self):\n        _, s = self.session()\n        if not s: return self.send(401, json.dumps({\"error\": \"sign in with Entra ID first\"}), \"application/json\")\n        mode = {\"/api/2lo\": \"2lo\", \"/api/obo\": \"obo\", \"/api/obo_graph\": \"obo_graph\", \"/api/3lo\": \"3lo\"}.get(self.path)\n        if not mode: return self.send(404, \"{}\", \"application/json\")\n        payload = {\"mode\": mode, **({\"return_url\": RETURN_3LO} if mode == \"3lo\" else {})}\n        r = agent(s, payload); r.pop(\"authorizationUrl\", None)   # vault check only: never redirect from a POST\n        self.send(200, json.dumps({\"inbound\": s[\"inbound\"], \"result\": r}), \"application/json\")"}, "i19_doc": {"file": "infra/entra-id/03-entra-agent-setup.py", "start": 1, "end": 12, "code": "\"\"\"Entra ID track, Parts 2–4 (Entra ID x AgentCore Identity: 2LO / 3LO / OBO): Entra side, via Microsoft Graph (Entra ID Free only).\nIdempotent. Creates / updates:\n  - rsidc-mall-api App Roles: allowedMemberTypes += Application  (so an APP can hold Tools.Mall.* for 2LO)\n  - app rsidc-entra-agent (confidential): the agent's own API (api://<appId>/access_as_user, v2 tokens) AND the OAuth\n    client that the AgentCore Identity credential provider uses for all three flows:\n      2LO  client_credentials  -> app-only token for rsidc-mall-api (roles = the APP's roles: List + Footfall)\n      3LO  authorization code  -> delegated Microsoft Graph User.Read (consent; web redirect = AgentCore callback URL)\n      OBO  jwt-bearer on_behalf_of -> delegated rsidc-mall-api mcp.access with the USER's roles\n    admin consent for its delegated permissions; client secret written ONLY to <secret store> (0600, gitignored)\n  - test client rsidc-mall-test-client: += delegated access_as_user on the agent API (users get tokens to call the runtime)\nEnv: AGENT_REDIRECTS (space-separated web redirect URIs, e.g. the AgentCore credential provider callbackUrl).\nRun: .venv/bin/python infra/entra-id/03-entra-agent-setup.py\"\"\""}, "i19_app": {"file": "infra/entra-id/03-entra-agent-setup.py", "start": 70, "end": 87, "code": "# --- the agent's app ---\nagent = one(\"/applications\", \"displayName eq 'rsidc-entra-agent'\")\nif not agent:\n    agent = g(\"POST\", \"/applications\", {\n        \"displayName\": \"rsidc-entra-agent\", \"signInAudience\": \"AzureADMyOrg\",\n        \"api\": {\"requestedAccessTokenVersion\": 2, \"oauth2PermissionScopes\": [{\n            \"id\": str(uuid.uuid4()), \"value\": \"access_as_user\", \"type\": \"User\", \"isEnabled\": True,\n            \"adminConsentDisplayName\": \"Call the rsidc Entra agent\", \"adminConsentDescription\": \"Call the rsidc Entra agent on AgentCore Runtime\",\n            \"userConsentDisplayName\": \"Call the rsidc Entra agent\", \"userConsentDescription\": \"Call the rsidc Entra agent on AgentCore Runtime\"}]}})\n    print(\"created app rsidc-entra-agent\")\nredirects = sorted(set(agent.get(\"web\", {}).get(\"redirectUris\", [])) | set(os.environ.get(\"AGENT_REDIRECTS\", \"\").split()))\ng(\"PATCH\", f\"/applications/{agent['id']}\", {\n    \"identifierUris\": [f\"api://{agent['appId']}\"], \"web\": {\"redirectUris\": redirects},\n    \"optionalClaims\": {\"idToken\": [{\"name\": \"login_hint\", \"essential\": False}]},\n    \"requiredResourceAccess\": merge_rra(agent, {\n        GRAPH_APP: {(graph_scope[s], \"Scope\") for s in (\"User.Read\", \"openid\", \"profile\", \"offline_access\")},\n        api[\"appId\"]: {(mcp_scope, \"Scope\")} | {(role_ids[r], \"Role\") for r in APP_ROLES_FOR_AGENT}})})\nagent = g(\"GET\", f\"/applications/{agent['id']}\")"}, "i19_grant": {"file": "infra/entra-id/03-entra-agent-setup.py", "start": 88, "end": 90, "code": "agent_sp = sp_for(agent[\"appId\"])\ngrant(agent_sp, graph_sp, [\"User.Read\", \"openid\", \"profile\", \"offline_access\"])   # 3LO / OBO-to-Graph: admin-consented\ngrant(agent_sp, api_sp, [\"mcp.access\"])                                            # OBO: delegated mall API"}, "i19_secret": {"file": "infra/entra-id/03-entra-agent-setup.py", "start": 96, "end": 102, "code": "# --- client secret (only when there is none on disk) ---\nif not os.path.exists(SECRET_FILE):\n    end = (datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(days=90)).strftime(\"%Y-%m-%dT%H:%M:%SZ\")\n    pw = g(\"POST\", f\"/applications/{agent['id']}/addPassword\", {\"passwordCredential\": {\"displayName\": \"agentcore-credential-provider\", \"endDateTime\": end}})\n    os.makedirs(os.path.dirname(SECRET_FILE), exist_ok=True)\n    with os.fdopen(os.open(SECRET_FILE, os.O_CREAT | os.O_WRONLY | os.O_TRUNC, 0o600), \"w\", encoding=\"utf-8\") as f: f.write(f\"ENTRA_AGENT_CLIENT_SECRET={pw['secretText']}\\n\")\n    os.chmod(SECRET_FILE, 0o600); print(\"client secret created (90 days) -> <secret store>\")"}, "i20_cp": {"file": "infra/entra-id/04-entra-agentcore.sh", "start": 6, "end": 25, "code": "# 1) credential provider (client secret read from the gitignored file, never echoed)\nif ! aws bedrock-agentcore-control get-oauth2-credential-provider --region $R --name $CP >/dev/null 2>&1; then\n  ROOT=\"$ROOT\" \"$ROOT/.venv/bin/python\" - \"$CP\" <<'PY'\nimport json, os, subprocess, sys, tempfile\nsec = dict(l.strip().split(\"=\", 1) for l in open(os.path.join(os.environ[\"ROOT\"], \"<secret store>\")) if \"=\" in l)[\"ENTRA_AGENT_CLIENT_SECRET\"]\nspec = {\"name\": sys.argv[1], \"credentialProviderVendor\": \"MicrosoftOauth2\", \"oauth2ProviderConfigInput\": {\"microsoftOauth2ProviderConfig\": {\n        \"clientId\": os.environ[\"ENTRA_AGENT_APP_ID\"], \"clientSecret\": sec, \"tenantId\": os.environ[\"ENTRA_TENANT_ID\"]}}}\nfd, spec_path = tempfile.mkstemp(suffix=\".json\")  # mkstemp creates the file 0600; the secret never goes on argv\ntry:\n    with os.fdopen(fd, \"w\", encoding=\"utf-8\") as f:\n        json.dump(spec, f)\n    subprocess.run([\"aws\", \"bedrock-agentcore-control\", \"create-oauth2-credential-provider\", \"--region\", os.environ[\"RT_REGION\"],\n                    \"--cli-input-json\", \"file://\" + spec_path], check=True, stdout=subprocess.DEVNULL)\nfinally:\n    os.unlink(spec_path)\nPY\nfi\nsave CP_ENTRA_CALLBACK $(aws bedrock-agentcore-control get-oauth2-credential-provider --region $R --name $CP --query callbackUrl --output text)\nsave CP_ENTRA_SECRET_ARN $(aws bedrock-agentcore-control get-oauth2-credential-provider --region $R --name $CP --query clientSecretArn.secretArn --output text)\nAGENT_REDIRECTS=\"$CP_ENTRA_CALLBACK\" \"$ROOT/.venv/bin/python\" \"$ROOT/infra/entra-id/03-entra-agent-setup.py\" | grep redirectUris   # 3LO redirect on the Entra app"}, "i20_rt": {"file": "infra/entra-id/04-entra-agentcore.sh", "start": 39, "end": 46, "code": "json.dump({\n  \"agentRuntimeArtifact\": {\"codeConfiguration\": {\"code\": {\"s3\": {\"bucket\": b, \"prefix\": k}}, \"runtime\": \"PYTHON_3_12\", \"entryPoint\": [\"main.py\"]}},\n  \"roleArn\": e[\"ENTRA_RT_ROLE_ARN\"], \"networkConfiguration\": {\"networkMode\": \"PUBLIC\"},\n  \"authorizerConfiguration\": {\"customJWTAuthorizer\": {\"discoveryUrl\": f\"https://login.microsoftonline.com/{e['ENTRA_TENANT_ID']}/v2.0/.well-known/openid-configuration\",\n                                                      \"allowedAudience\": [e[\"ENTRA_AGENT_APP_ID\"]]}},\n  \"requestHeaderConfiguration\": {\"requestHeaderAllowlist\": [\"Authorization\"]},\n  \"protocolConfiguration\": {\"serverProtocol\": \"HTTP\"},\n  \"environmentVariables\": {\"CP_ENTRA\": \"rsidc-entra\", \"MALL_API_APP_ID\": e[\"ENTRA_API_APP_ID\"], \"ENTRA_GW_URL\": e[\"ENTRA_GW_URL\"]},"}, "i20_wi": {"file": "infra/entra-id/04-entra-agentcore.sh", "start": 58, "end": 61, "code": "WI=$(aws bedrock-agentcore-control get-agent-runtime --region $R --agent-runtime-id $ENTRA_RT_ID --query workloadIdentityDetails.workloadIdentityArn --output text); save ENTRA_WI_NAME ${WI##*/}\n# merge, never replace: keeps the Entra GUI's /3lo/callback (added by 14-deploy-webchat.sh)\nCURU=$(aws bedrock-agentcore-control get-workload-identity --region $R --name ${WI##*/} --query 'allowedResourceOauth2ReturnUrls' --output text 2>/dev/null || true)\naws bedrock-agentcore-control update-workload-identity --region $R --name ${WI##*/} --allowed-resource-oauth2-return-urls $(echo $CURU http://localhost:8765/callback ${WEB_ENTRA_URL:+$WEB_ENTRA_URL/3lo/callback} | tr ' \\t' '\\n\\n' | grep -v '^None$' | grep . | sort -u) >/dev/null"}, "t_first": {"file": "Entra 身份测试脚本（节选）", "start": 60, "end": 64, "code": "    if phase == \"3lo\":\n        # dedicated user: interactive sign-in of wei/ds1/chen now hits the Security-defaults MFA registration (no skip left)\n        u = os.environ.get(\"ENTRA_3LO_USER\", \"lo3user\"); t = user_token(u)\n        s, b = call(t, {\"mode\": \"3lo\", \"return_url\": RETURN, \"force\": True})\n        rec(\"first call -> consent required\", \"CONSENT_REQUIRED\", b.get(\"status\"), f\"http={s} has_url={bool(b.get('authorizationUrl'))} err={b.get('error')}\")"}, "t_cbsrv": {"file": "Entra 身份测试脚本（节选）", "start": 65, "end": 71, "code": "        got = {}\n\n        class CB(http.server.BaseHTTPRequestHandler):\n            def log_message(self, *a): pass\n            def do_GET(self):\n                got.update(urllib.parse.parse_qs(urllib.parse.urlparse(self.path).query)); self.send_response(200); self.end_headers(); self.wfile.write(b\"ok\")\n        srv = http.server.HTTPServer((\"127.0.0.1\", 8765), CB); threading.Thread(target=srv.serve_forever, daemon=True).start()"}, "t_requri": {"file": "Entra 身份测试脚本（节选）", "start": 79, "end": 87, "code": "        # launch the browser first: launching AND navigating in one call can load the one-time request_uri twice\n        # (AgentCore then answers \"Invalid request\")\n        subprocess.run(ab + [\"open\", \"about:blank\"], capture_output=True); time.sleep(2)\n        retries = 0\n        for retries in range(3):  # AgentCore's hosted /authorize      s, b = call(t, {\"mode\": \"3lo\", \"return_url\": RETURN, \"session_uri\": got[\"session_id\"][0]})\n        rec(f\"token from vault -> Graph /me is {u}\", (\"TOKEN_FROM_VAULT\", f\"{u}@{D}\".lower()), (b.get(\"status\"), (b.get(\"me\", {}).get(\"userPrincipalName\") or \"\").lower()), f\"graph_http={b.get('graph_http')} err={b.get('error')}\")\n        s, b = call(user_token(\"wei\"), {\"mode\": \"3lo\", \"return_url\": RETURN})\n        rec(f\"wei (no consent of its own) does not get {u}'s token\", \"CONSENT_REQUIRED\", b.get(\"status\"), \"vault is per (agent, user)\")"}}, "gui_row": "3LO: consent completed · CompleteResourceTokenAuth OK · TOKEN_FROM_VAULT · identity guard passes · Graph /me = lo3user"}</script>

// Renders page-built markup without innerHTML: parse, drop active content, insert nodes. Data values are escaped by esc() at the call sites.
function safeRender(el, html, append) {
  const svg = el instanceof SVGElement;
  const doc = new DOMParser().parseFromString(svg ? `<svg xmlns="http://www.w3.org/2000/svg">${html}</svg>` : "<body>" + html, "text/html");
  doc.querySelectorAll("script,iframe,object,embed,link,meta,base,form").forEach(n => n.remove());
  doc.querySelectorAll("*").forEach(n => [...n.attributes].forEach(a => {
    const v = a.value.trim().toLowerCase();
    if (a.name.startsWith("on") || ((a.name === "href" || a.name === "src" || a.name === "xlink:href") && v.startsWith("javascript:"))) n.removeAttribute(a.name);
  }));
  const nodes = svg ? [...doc.querySelector("svg").childNodes] : [...doc.body.childNodes];
  append ? el.append(...nodes) : el.replaceChildren(...nodes);
}

const D = JSON.parse(document.getElementById("data").textContent);

  "session bound to the signed-in user (CompleteResourceTokenAuth)": "会话已绑定到已登录用户（CompleteResourceTokenAuth）",
  "token from vault -> Graph /me is lo3user": "token 来自 vault → Graph /me 为 lo3user",
  "wei (no consent of its own) does not get lo3user's token": "wei（本人未同意）拿不到 lo3user 的 token"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const $ = id => document.getElementById(id);
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
const fmtv = v => typeof v === "object" && v !== null ? JSON.stringify(v) : String(v);
const kv = o => !o ? "" : `<table>${Object.entries(o).map(([k, v]) => `<tr><td class="k">${esc(k)}</td><td>${esc(fmtv(v))}</td></tr>`).join("")}</table>`;
const footer = dates => `<footer class="src">测试记录（${esc(dates)}）</footer>`;
function excerpt(key) {
  const x = D.x[key]; if (!x) return "";
  const lines = x.code.split("\n").map((l, i) => `<div><span class="ln">${x.start + i}</span>${esc(l) || " "}</div>`).join("");
  return `<div class="code"><div class="h">${esc(x.file)}:${x.start}-${x.end}</div><pre>${lines}</pre></div>`;
}

<style>
details.codefold{margin:6px 0}
details.codefold>summary{cursor:pointer;display:inline-block;padding:3px 10px;border:1px solid #8884;border-radius:6px;
  font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:inherit;opacity:.85;user-select:none}
details.codefold>summary:hover{opacity:1}
details.codefold[open]>summary{margin-bottom:6px}
</style>
<script>
(function () {
  var CODE_FILE = /[\w./-]+\.(py|sh|js|mjs|ts|tsx|json|sql|html|md|txt|yaml|yml)(:\d+(-\d+)?)?/;
  function label(el) {
    var p = el.previousElementSibling, t = p && p.textContent.trim();
    return t && t.length < 140 && CODE_FILE.test(t) ? t : '';
  }
  function wrap(el) {
    if (el.dataset.codefold || el.closest('details.codefold')) return;
    if (el.tagName === 'PRE' && el.parentElement && el.parentElement.closest('.code')) return;  // the outer .code is wrapped
    el.dataset.codefold = '1';
    var lines = (el.textContent.replace(/\n+$/, '').match(/\n/g) || []).length + 1;
    var kind = el.classList.contains('out') ? '显示输出' : '显示代码';
    var lb = label(el);
    var d = document.createElement('details'), s = document.createElement('summary');
    d.className = 'codefold';
    s.textContent = '▸ ' + kind + (lb ? ' · ' + lb : '') + '（' + lines + ' 行）';
    el.parentNode.insertBefore(d, el);
    d.appendChild(s); d.appendChild(el);
  }
  function scan(root) {
    if (root.nodeType !== 1) return;
    if (root.matches('pre, .code')) wrap(root);
    root.querySelectorAll('pre, .code').forEach(wrap);
  }
  function start() {
    scan(document.body);
    new MutationObserver(function (ms) {
      ms.forEach(function (m) { m.addedNodes.forEach(scan); });
    }).observe(document.body, { childList: true, subtree: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>

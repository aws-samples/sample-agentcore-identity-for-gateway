:root{--bg:#f6f7f9;--card:#fff;--ink:#16191f;--mut:#5f6b7a;--line:#e3e6ea;--acc:#0972d3;--ms:#0067b8;--ok:#037f0c;--okb:#e9f7ea;--no:#c0262d;--nob:#fdecec;--warn:#8a5a00;--warnb:#fff6e0;--code:#0f1b2a}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.banner{background:#232f3e;color:#fff;padding:8px 20px;font-size:13px;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:5}
.banner b{color:#ff9900}
.wrap{display:flex;min-height:calc(100vh - 38px)}
nav{width:230px;flex:none;background:#fff;border-right:1px solid var(--line);padding:18px 0;position:sticky;top:38px;height:calc(100vh - 38px)}
nav h1{font-size:15px;margin:0 18px 4px}nav .sub{font-size:12px;color:var(--mut);margin:0 18px 16px}
nav a{display:block;padding:9px 18px;color:var(--ink);text-decoration:none;border-left:3px solid transparent;cursor:pointer}
nav a.on{border-left-color:var(--acc);background:#f0f6fc;color:var(--acc);font-weight:600}
main{flex:1;min-width:0;padding:22px 28px 60px;max-width:1240px}
.view{display:none}.view.on{display:block}
.arch img{display:block;width:100%;height:auto}
h2{margin:0 0 4px;font-size:22px}h3{margin:18px 0 8px;font-size:16px}.lead{color:var(--mut);margin:0 0 16px;max-width:900px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;overflow-x:auto}
.card h2{font-size:16px;margin:0 0 8px}.card h3{font-size:14px;margin:14px 0 6px}
@media(max-width:1000px){nav{display:none}}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
:not(pre)>code{background:#eef1f4;padding:1px 5px;border-radius:4px;word-break:break-all}
.code code,pre code{background:none;padding:0}
pre{margin:0;background:var(--code);color:#d7e2ee;border-radius:8px;padding:10px 0;overflow:auto;font-size:12px;line-height:1.55}
pre.out{margin:6px 0;padding:10px 14px;white-space:pre-wrap;word-break:break-all}
table{border-collapse:collapse;width:100%;margin-top:8px}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;overflow-wrap:anywhere}th{font-size:12px;color:var(--mut);font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600}
.ok{background:var(--okb);color:var(--ok)}.no{background:var(--nob);color:var(--no)}.warn{background:var(--warnb);color:var(--warn)}.mut{background:#eef1f4;color:var(--mut)}
/* part4: result cells (text colour only), changed claim */
td.ok,td.no{background:none;font-weight:600}td.diff{background:var(--warnb)}
/* part4: buttons, in part1's .btn / .btn.pri style */
button.act,button.ghost{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit;margin:4px 6px 4px 0}
button.act{background:var(--acc);border-color:var(--acc);color:#fff}
button.act:hover,button.ghost:hover{border-color:var(--acc)}
button.act:disabled,button.ghost:disabled{opacity:.5;cursor:default}
/* part4: accents, notes, footer */
.card.obo{border-left:4px solid var(--acc)}.card.gw{border-left:4px solid #8c4fff}.card.warn{border-left:4px solid #ff9900;background:var(--card);color:inherit}
.note{font-size:13px;color:var(--mut)}.expect{font-size:13px;background:#f0f6fc;border-left:3px solid var(--acc);border-radius:0 6px 6px 0;padding:6px 10px;margin:8px 0}
.src{font-size:12px;color:var(--mut);margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
footer.vf{margin-top:18px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--mut)}

.users{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}

.user:hover{border-color:var(--acc)}.user.on{border-color:var(--acc);background:#f0f6fc;box-shadow:0 0 0 3px #d6e8fa}.user b{display:block;font-size:14px}.user span{font-size:12px;color:var(--mut)}

.chips .none{background:var(--nob);color:var(--no);border-color:#f3c2c4}

.fake input:focus{border-bottom-color:var(--ms)}
.fake .go{background:var(--ms);color:#fff;border:0;padding:7px 26px;float:right;cursor:pointer;font:inherit}

.code .ln{display:block;white-space:pre;padding-right:14px}.code .ln i{color:#6b7c8f;font-style:normal;display:inline-block;width:42px;text-align:right;padding-right:12px;user-select:none}
.code .red{color:#f5b971}.xhdr{font-size:12px;color:var(--mut);margin:10px 0 4px}

": [{"n": 6, "t": "# 1) credential provider (client secret read from the gitignored file, never echoed)"}, {"n": 7, "t": "if ! aws bedrock-agentcore-control get-oauth2-credential-provider --region $R --name $CP >/dev/null 2>&1; then"}, {"n": 8, "t": "  ROOT=\"$ROOT\" \"$ROOT/.venv/bin/python\" - \"$CP\" <<'PY'"}, {"n": 9, "t": "import json, os, subprocess, sys, tempfile"}, {"n": 10, "t": "# [line 10 redacted on this page: it reads a test password / client secret from a secret store]"}, {"n": 11, "t": "spec = {\"name\": sys.argv[1], \"credentialProviderVendor\": \"MicrosoftOauth2\", \"oauth2ProviderConfigInput\": {\"microsoftOauth2ProviderConfig\": {"}, {"n": 12, "t": "        \"clientId\": os.environ[\"ENTRA_AGENT_APP_ID\"], \"clientSecret\": sec, \"tenantId\": os.environ[\"ENTRA_TENANT_ID\"]}}}"}, {"n": 13, "t": "fd, spec_path = tempfile.mkstemp(suffix=\".json\")  # mkstemp creates the file 0600; the secret never goes on argv"}, {"n": 14, "t": "try:"}, {"n": 15, "t": "    with os.fdopen(fd, \"w\", encoding=\"utf-8\") as f:"}, {"n": 16, "t": "        json.dump(spec, f)"}, {"n": 17, "t": "    subprocess.run([\"aws\", \"bedrock-agentcore-control\", \"create-oauth2-credential-provider\", \"--region\", os.environ[\"RT_REGION\"],"}, {"n": 18, "t": "                    \"--cli-input-json\", \"file://\" + spec_path], check=True, stdout=subprocess.DEVNULL)"}, {"n": 19, "t": "finally:"}, {"n": 20, "t": "    os.unlink(spec_path)"}, {"n": 21, "t": "PY"}, {"n": 22, "t": "fi"}], "note": "Credential provider rsidc-entra：vendor MicrosoftOauth2，tenantId + agent 应用的 client id/secret。"}, "entra_agent_app": {"file": "infra/entra-id/03-entra-agent-setup.py", "start": 70, "end": 94, "lines": [{"n": 70, "t": "# --- the agent's app ---"}, {"n": 71, "t": "agent = one(\"/applications\", \"displayName eq 'rsidc-entra-agent'\")"}, {"n": 72, "t": "if not agent:"}, {"n": 73, "t": "    agent = g(\"POST\", \"/applications\", {"}, {"n": 74, "t": "        \"displayName\": \"rsidc-entra-agent\", \"s ignedTo\")[\"value\"]}"}, {"n": 92, "t": "for r in APP_ROLES_FOR_AGENT:                                                      # 2LO: application permissions"}, {"n": 93, "t": "    if (agent_sp[\"id\"], role_ids[r]) not in have:"}, {"n": 94, "t": "        g(\"POST\", f\"/servicePrincipals/{api_sp['id']}/appRoleAssignedTo\", {\"principalId\": agent_sp[\"id\"], \"resourceId\": api_sp[\"id\"], \"appRoleId\": role_ids[r]})"}], "note": "rsidc-entra-agent：公开 access_as_user（v2），请求委托权限 mcp.access，并授予管理员同意。"}, "entra_grant_fn": {"file": "infra/entra-id/03-entra-agent-setup.py", "start": 45, "end": 50, "lines": [{"n": 45, "t": "def grant(client_sp, res_sp, scopes):  # admin consent (AllPrincipals) for delegated scopes, merged"}, {"n": 46, "t": "    cur = one(\"/oauth2PermissionGrants\", f\"clientId eq '{client_sp['id']}' and resourceId eq '{res_sp['id']}'\")"}, {"n": 47, "t": "    if not cur:"}, {"n": 48, "t": "        g(\"POST\", \"/oauth2PermissionGrants\", {\"clientId\": client_sp[\"id\"], \"consentType\": \"AllPrincipals\", \"resourceId\": res_sp[\"id\"], \"scope\": \" \".join(scopes)})"}, {"n": 49, "t": "    elif not set(scopes) <= set(cur[\"scope\"].split()):"}, {"n": 50, "t": "        g(\"PATCH\", f\"/oauth2PermissionGrants/{cur['id']}\", {\"scope\": \" \".join(sorted(set(cur[\"scope\"].split()) | set(scopes)))})"}], "note": "管理员同意 = 一个 AllPrincipals oauth2PermissionGrant（这就是 OBO 不需要同意提示的原因）。"}, "entra_mallapi_app": {"file": "infra/entra-id/03-entra-agent-setup.py", "start": 59, "end": 66, "lines": [{"n": 59, "t": "# --- rsidc-mall-api: let applications hold the Tools.Mall.* roles (2LO) ---"}, {"n": 60, "t": "api = one(\"/applications\", \"displayName eq 'rsidc-mall-api'\")"}, {"n": 61, "t": "roles = api[\"appRoles\"]"}, {"n": 62, "t": "if any(\"Application\" not in r[\"allowedMemberTypes\"] for r in roles):"}, {"n": 63, "t": "    for r in roles: r[\"allowedMemberTypes\"] = sorted(set(r[\"allowedMemberTypes\"]) | {\"Application\"})"}, {"n": 64, "t": "    g(\"PATCH\", f\"  "note": "按用户的 App Role 分配：这是变更测试唯一修改的内容。"}, "gw_auth": {"file": "infra/entra-id/02-entra-gateway.sh", "start": 11, "end": 17, "lines": [{"n": 11, "t": "DISC=\"https://login.microsoftonline.com/$ENTRA_TENANT_ID/v2.0/.well-known/openid-configuration\""}, {"n": 12, "t": "GR=${PROJECT}-mall-gateway-role; MALL_FN=arn:aws:lambda:$R:${ACCOUNT_ID}:function:${PROJECT}-mall-tools"}, {"n": 13, "t": "AUTH=\"{\\\"customJWTAuthorizer\\\":{\\\"discoveryUrl\\\":\\\"$DISC\\\",\\\"allowedAudience\\\":[\\\"$ENTRA_API_APP_ID\\\"]}}\""}, {"n": 14, "t": "if [ -z \"${ENTRA_GW_ID:-}\" ]; then"}, {"n": 15, "t": "  save ENTRA_GW_ID $(aws bedrock-agentcore-control create-gateway --region $R --name ${PROJECT}-mall-entra-gateway --role-arn arn:aws:iam::${ACCOUNT_ID}:role/$GR \\"}, {"n": 16, "t": "    --protocol-type MCP --authorizer-type CUSTOM_JWT --description \"rsidc Part 6: Entra ID version (Entra JWT + App Roles -> Cedar -> mall tools)\" \\"}, {"n": 17, "t": "    --authorizer-configuration \"$AUTH\" --query gatewayId --output text)"}], "note": "Gateway 入站：CUSTOM_JWT，Entra v2 discovery，allowedAudience = rsidc-mall-api。"}, "gw_target": {"file": "infra/entra-id/02-entra-gateway.sh", "start": 23, "end": 27, "lines": [{"n": 23, "t": "if ! aws bedrock-agentcore-control list-gateway-targets --region $R --gateway-identifier $ENTRA_GW_ID --query \"items[?name=='mall'].targetId\" --output text | grep -q .; then"}, {"n": 24, "t": "  CFG=$(python3 -c \"import json,sys;print(json.dumps({'mcp':{'lambda':{'lambdaArn':sys.argv[1],'toolSchema':{'inlinePayload':json.load(open(sys.argv[2]))}}}}))\" $MALL_FN \"$ROOT/infra/common/lambda/mall_tools/tools.json\")"}, {"n": 25, "t": "  aws bedrock-agentcore-control create-gateway-target --region $R --gateway-identifier $ENTRA_GW_ID --name mall \\"}, {"n": 26, "t": "    --description \"Customer mall-footfall tools (4)\" --target-configuration \"$CFG\" \\"}, {"n": 27, "t": "    --credential-provider-configurations '[{\"credentialProviderType\":\"GATEWAY_IAM_ROLE\"}]' >/dev/null"}], "note": "Target mall：即 Lambda，以 gateway 的 IAM 角色调用（用户 token 永远不会到达它）。"}, "gw_cedar": {"file": "infra/entra-id/02-entra-gateway.sh", "start": 37, "end": 46, "lines": [{"n": 37, "t": "policy() {  # identical rule shape to the Cognito customer version; only the gateway ARN differs"}, {"n": 38, "t": "  aws bedrock-agentcore-control list-policies --region $R --policy-engine-id $ENTRA_PE_ID --query \"policies[?name=='$1'].policyId\" --output text | grep -q . && return"}, {"n": 39, "t": "  local stmt=\"permit(principal is AgentCore::OAuthUser, action == AgentCore::Action::\\\"$2\\\", resource == AgentCore::Gateway::\\\"$ENTRA_GW_ARN\\\") when { principal.hasTag(\\\"roles\\\") && principal.getTag(\\\"roles\\\") like \\\"*\\\\\\\"$3\\\\\\\"*\\\" };\""}, {"n": 40, "t": "  aws bedrock-agentcore-control create-policy --region $R --policy-engine-id $ENTRA_PE_ID --name $1 \\"}, {"n": 41, "t": "    --description \"$2 requires Entra App Role $3\" --definition \"$(jq -cn --arg s \"$stmt\" '{cedar:{statement:$s}}')\" >/dev/null"}, {"n": 42, "t": "}"}, {"n": 43, "t": "policy entra_mall_list     mall___get_mall_list        Tools.Mall.List"}, {"n": 44, "t": "policy entra_mall_footfall mall___get_footfall_summary Tools.Mall.Footfall"}, {"n": 45, "t": "policy entra_mall_hourly   mall___get_hourly_traffic   Tools.Mall.Hourly"}, {"n": 46, "t": "policy entra_mall_zone     mall___get_zone_comparison  Tools.Mall.Zone"}], "note": "每个工具一条固定的 Cedar permit，基于 token 的 roles claim。"}, "gw_mode": {"file": "infra/entra-id/02-entra-gateway.sh", "start": 52, "end": 55, "lines": [{"n": 52, "t": "for try in 1 2 3 4 5 6; do aws bedrock-agentcore-control update-gateway --region $R --gateway-identifier $ENTRA_GW_ID \\"}, {"n": 53, "t": "  --name \"$(jq -r .name <<<\"$G\")\" --role-arn \"$(jq -r .roleArn <<<\"$G\")\" --protocol-type MCP --description \"$(jq -r .description <<<\"$G\")\" \\"}, {"n": 54, "t": "  --authorizer-type CUSTOM_JWT --authorizer-configuration \"$(jq -c .authorizerConfiguration <<<\"$G\")\" \\"}, {"n": 55, "t": "  --policy-engine-configuration \"{\\\"arn\\\":\\\"$ENTRA_PE_ARN\\\",\\\"mode\\\":\\\"$MODE\\\"}\" >/dev/null && break; sleep 10; done  # IAM propagation"}], "note": "以 LOG_ONLY 或 ENFORCE 模式挂载 policy engine。"}, "rbac_matrix": {"file": "Entra RBAC 测试脚本（节选）", "start": 70, "end": 85, "lines": [{"n": 70, "t": "    if phase in (\"log_only\", \"enforce\"):"}, {"n": 71, "t": "        enforce = phase == \"enforce\""}, {"n": 72, "t": "        for u in (\"wei\", \"ds1\", \"chen\"):"}, {"n": 73, "t": "            t = entra_token(u); c = claims(t)"}, {"n": 74, "t": "            exp = EXPECT[u] if enforce else set(TOOLS)"}, {"n": 75, "t": "            s, names = listed(t)"}, {"n": 76, "t": "            rec(f\"{u} tools/list\", sorted(exp), names, f\"http={s} ver={c.get('ver')} roles={c.get('roles')}\")"}, {"n": 77, "t": "            for tool in TOOLS:"}, {"n": 78, "t": "                ok, s, d = call(t, tool)"}, {"n": 79, "t": "                rec(f\"{u} tools/call {tool.split('___')[1]}\", tool in exp, ok, f\"http={s} {d}\")"}, {"n": 80, "t": "        if enforce:"}, {"n": 81, "t": "            s, _ = rpc(tamper(entra_token(\"ds1\")), \"tools/list\"); rec(\"tampered ds1 token (roles forged to all 4)\", 403, s, \"signature check\")"}, {"n": 82, "t": "            s, _ = rpc(cognito_access_token(\"wei\"), \"tools/list\"); rec(\"Cognito access token (other issuer)\", 403, s, \"issuer/JWKS\")"}, {"n": 83, "t": "            g = entra_token(\"wei\", \"https://graph.microsoft.com/.default\")"}, {"n": 84, "t": "            s, _ = rpc(g, \"tools/list\"); rec(\"Entra token for Microsoft Graph (wrong audience)\", True, s in (401, 403), f\"http={s} aud={claims(g).get('aud')}\")"}, {"n": 85, "t": "            s, _ = rpc(\"not-a-jwt\", \"tools/list\"); rec(\"garbage bearer\", 401, s, \"\")"}], "note": "log_only / enforce 矩阵 + 负向测试 token。"}, "rbac_tamper": {"file": "Entra RBAC 测试脚本（节选）", "start": 49, "end": 52, "lines": [{"n": 49, "t": "def tamper(token):"}, {"n": 50, "t": "    h, p, sig = token.split(\".\")"}, {"n": 51, "t": "    c = json.loads(base64.urlsafe_b64decode(p + \"==\")); c[\"roles\"] = [\"Tools.Mall.List\", \"Tools.Mall.Footfall\", \"Tools.Mall.Hourly\", \"Tools.Mall.Zone\"]"}, {"n": 52, "t": "    return f\"{h}.{base64.urlsafe_b64encode(json.dumps(c).encode()).decode().rstrip('=')}.{sig}\""}], "note": "篡改 token 的构造方式（改写 payload，保留签名）。"}, "rbac_change": {"file": "Entra RBAC 测试脚本（节选）", "start": 86, "end": 103, "lines": [{"n": 86, "t": "    if phase == \"change\":  # only the Entra App Role assignment changes; Cedar / Lambda / Gateway untouched"}, {"n": 87, "t": "        sp = graph(\"GET\", f\"/servicePrincipals?$filter=appId eq '{API}'\")[\"value\"][0]"}, {"n": 88, "t": "        role = next(r[\"id\"] for r in sp[\"appRoles\"] if r[\"value\"] == \"Tools.Mall.Hourly\")"}, {"n": 89, "t": "        uid = graph(\"GET\", f\"/users/ds1@{D}\")[\"id\"]"}, {"n": 90, "t": "        old = entra_token(\"ds1\"); ok, s, d = call(old, \"mall___get_hourly_traffic\"); rec(\"before: ds1 hourly\", False, ok, f\"roles={claims(old).get('roles')}\")"}, {"n": 91, "t": "        a = graph(\"POST\", f\"/servicePrincipals/{sp['id']}/appRoleAssignedTo\", {\"principalId\": uid, \"resourceId\": sp[\"id\"], \"appRoleId\": role})"}, {"n": 92, "t": "        try:"}, {"n": 93, "t": "            t0 = time.time(); new = None"}, {"n": 94, "t": "            for _ in range(12):  # Entra directory replication: poll until a fresh token carries the role"}, {"n": 95, "t": "                new = entra_token(\"ds1\")"}, {"n": 96, "t": "                if \"Tools.Mall.Hourly\" in (claims(new).get(\"roles\") or []): break"}, {"n": 97, "t": "                time.sleep(10)"}, {"n": 98, "t": "            ok, s, d = call(new, \"mall___get_hourly_traffic\")"}, {"n": 99, "t": "            rec(\"after assignment, new token: ds1 hourly\", True, ok, f\"roles={claims(new).get('roles')} {time.time()-t0:.0f}s after assignment\")"}, {"n": 100, "t": "            ok, s, d = call(old, \"mall___get_hourly_traffic\"); rec(\"after assignment, OLD token: ds1 hourly\", False, ok, \"claims frozen until the old token expires\")"}, {"n": 101, "t": "        finally:"}, {"n": 102, "t": "            graph(\"DELETE\", f\"/servicePrincipals/{sp['id']}/appRoleAssignedTo/{a['id']}\")"}, {"n": 103, "t": "        rec(\"restore: Hourly assignment removed\", True, True, \"appRoleAssignment deleted\")"}], "note": "change：为 ds1 添加 Hourly 分配，轮询获取新 token，然后删除该分配。"}, "rbac_gui_login": {"file": "webchat/cognito-idc/rbac_app.py", "start": 91, "end": 92, "lines": [{"n": 91, "t": "            p = dict(response_type=\"code\", client_id=ENTRA[\"client\"], redirect_uri=ENTRA_REDIRECT, state=state, prompt=\"login\","}, {"n": 92, "t": "                     scope=f\"openid profile api://{ENTRA['api']}/mcp.access\", code_challenge=ch, code_challenge_method=\"S256\")"}], "note": "RBAC GUI 的 Entra 卡片：直接为 rsidc-mall-api 登录（不经过 OBO）。"}, "rbac_gui_check": {"file": "webchat/cognito-idc/rbac_app.py", "start": 150, "end": 153, "lines": [{"n": 150, "t": "        if self.path == \"/api/check/entra\":"}, {"n": 151, "t": "            _, e = self.entra_session()"}, {"n": 152, "t": "            if not e or not ENTRA_GW[\"url\"]: return self.send(401, json.dumps({\"error\": \"sign in with Entra ID first\"}), \"application/json\")"}, {"n": 153, "t": "            return self.send(200, json.dumps(check_gateway(ENTRA_GW, e[\"access\"])), \"application/json\")"}], "note": "RBAC GUI：在 Entra gateway 上检查工具（Check tools）。"}}, "checks": {"entra": [{"name": "分配解析为预期的角色值", "output": "ds1 Tools.Mall.Footfall\nds1 Tools.Mall.List\nwei Tools.Mall.Footfall\nwei Tools.Mall.Hourly\nwei Tools.Mall.List\nwei Tools.Mall.Zone", "date": "2026-10-07"}, {"name": "测试客户端：mcp.access 的管理员同意（AllPrincipals）", "output": "AllPrincipals\temail offline_access openid profile\nAllPrincipals\tmcp.access", "date": "2026-10-07"}], "gw": [{"name": "入站：Entra v2 discovery + allowedAudience = API appId", "output": "{\n    \"discoveryUrl\": \"https://login.microsoftonline.com/{entra-tenant-id}/v2.0/.well-known/openid-configuration\",\n    \"allowedAudience\": [\n        \"{mall-api-app-id}\"\n    ]\n}", "date": "2026-10-07"}, {"name": "policy engine 已以 ENFORCE 模式挂载", "output": "READY\tENFORCE\tarn:aws:bedrock-agentcore:ap-southeast-1:123456789012:policy-engine/{entra-policy-engine-id}", "date": "2026-10-07"}, {"name": "target mall READY → Lambda rsidc-mall-tools（gateway IAM 角色）", "output": "READY\tarn:aws:lambda:ap-southeast-1:123456789012:function:rsidc-mall-tools\tGATEWAY_IAM_ROLE", "date": "2026-10-07"}, {"name": "4 条 Cedar 策略 ACTIVE", "output": "entra_mall_footfall\tACTIVE\nentra_mall_hourly\tACTIVE\nentra_mall_list\tACTIVE\nentra_mall_zone\tACTIVE", "date": "2026-10-07"}, {"name": "hourly 的 Cedar 规则要求 roles ∋ Tools.Mall.Hourly（不使用组名）", "output": "permit(principal is AgentCore::OAuthUser, action == AgentCore::Action::\"mall___get_hourly_traffic\", resource == AgentCore::Gateway::\"arn:aws:bedrock-agentcore:ap-southeast-1:123456789012:gateway/{entra-gateway-id}\") when { principal.hasTag(\"roles\") && principal.getTag(\"roles\") like \"*\\\"Tools.Mall.Hourly\\\"*\" };", "date": "2026-10-07"}]}, "screens": [{"card": "agent", "file": "img/entra-09-agent-app-expose-an-api.png", "caption": "rsidc-entra-agent · Expose an API：scope access_as_user（agent runtime 入站 token 的 audience）", "url": "https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationMenuBlade/~/ProtectAnAPI/appId/{entra-agent-app-id}", "look": "Application ID URI 为 api://{entra-agent-app-id}；一个 scope（access_as_user），Admins and users，Enabled；没有 authorized client applications（改用租户级管理员同意）。"}, {"card": "agent", "file": "img/entra-08-agent-app-api-permissions.png", "caption": "rsidc-entra-agent · API permissions：rsidc-mall-api 上的委托权限 mcp.access（OBO 交换时请求的权限），以及 Graph User.Read", "url": "https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationMenuBlade/~/CallAnAPI/appId/{entra-agent-app-id}", "look": "rsidc-mall-api mcp.access（Delegated）以及 Graph User.Read / openid / profile / offline_access，均已对目录 \"Granted for\"；两个 Application 角色（Tools.Mall.List / Footfall）用于仅应用的 2LO，与 OBO 无关。"}, {"card": "agent", "file": "img/entra-10-agent-app-certificates-secrets.png", "caption": "rsidc-entra-agent · Certificates & secrets：client secret 仅由 AgentCore Identity credential provider 持有（值已遮盖）", "url": "https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationMenuBlade/~/Credentials/appId/{entra-agent-app-id}", "look": "一个 client secret，描述为 agentcore-credential-provider，带有过期日期；值和 secret ID 已涂黑。请在过期前轮换，并更新 credential provider。"}, {"card": "agent", "file": "img/entra-06-test-client-api-permissions.png", "caption": "rsidc-mall-test-client · API permissions（用户登录所用的公共客户端：access_as_user、mcp.access、Graph OIDC scopes）", "url": "https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationMenuBlade/~/CallAnAPI/appId/{test-client-app-id}", "look": "rsidc-entra-agent access_as_user（用于 OBO 入站 token）和 rsidc-mall-api mcp.access（直接 RBAC 登录），均已对目录授予。"}, {"card": "api", "file": "img/entra-04-mall-api-expose-an-api.png", "caption": "rsidc-mall-api · Expose an API：scope mcp.access", "url": "https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationMenuBlade/~/ProtectAnAPI/appId/{mall-api-app-id}", "look": "scope mcp.access，Who can consent = Admins and users，State 为 Enabled：即 OBO 交换所请求的 scope。"}, {"card": "api", "file": "img/entra-02-mall-api-app-roles.png", "caption": "rsidc-mall-api · App roles Tools.Mall.*", "url": "https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationMenuBlade/~/AppRoles/appId/{mall-api-app-id}", "look": "4 个已启用的角色，值为 Tools.Mall.List / Footfall / Hourly / Zone；这些值会成为 Cedar 所匹配的 roles claim。"}, {"card": "api", "file": "img/entra-01-wei-app-role-assignments.png", "caption": "用户 wei · Applications：App Role 分配（Mall List / Zone / Hourly / Footfall）", "url": "https://entra.microsoft.com/#view/Microsoft_AAD_UsersAndTenants/UserProfileMenuBlade/~/Applications/userId/{entra-user-object-id}", "look": "列出 rsidc-mall-api 及 4 个 Mall 角色，均为直接分配。App Role 分配位于用户的 Applications 页面，而不在 \"Assigned roles\"（目录角色）下。"}, {"card": "api", "file": "img/entra-11-mall-api-users-and-groups.png", "caption": "rsidc-mall-api · Enterprise application · Users and groups（谁持有哪个 App Role）", "url": "https://entra.microsoft.com/#view/Microsoft_AAD_IAM/ManagedAppMenuBlade/~/Users/objectId/{entra-sp-object-id}/appId/{mall-api-app-id}", "look": "每个分配一行：wei 4 个，ds1 2 个，chen 不在列表中（没有 roles claim）；rsidc-entra-agent service principal 对应的行是其用于 2LO 的仅应用角色。"}], "arch": [{"file": "img/architecture-entra-obo.svg", "title": "OBO 流程：AgentCore Identity 交换用户的 Entra token", "alt": "Entra ID 登录 → AgentCore Runtime，AgentCore Identity 与 Entra 进行 OBO 交换，AgentCore Gateway（Cedar），Lambda；可选 Microsoft Graph", "caption": "步骤 1–8：用户的 token（aud = rsidc-entra-agent）到达 runtime，AgentCore Identity 代表用户将其交换为 aud = rsidc-mall-api 的 token，新 token 保留用户身份及其 App Roles，随后由 Gateway 和 Cedar 逐个工具做出决定。"}, {"file": "img/architecture-rbac-entra.svg", "title": "Gateway 工具 RBAC：Entra App Roles → roles claim → Cedar", "alt": "Entra App Roles 成为 roles claim；AgentCore Gateway 校验 Entra token，Cedar 按角色逐个放行工具", "caption": "Entra App Role 分配直接成为原生的 roles claim；Gateway 校验 Entra v2 token（allowedAudience = rsidc-mall-api），每个工具对应一条 Cedar 规则检查 roles。"}], "faq": [{"q": "为什么用户登录得到的 token 是签发给 agent 应用的，而不是 mall API？", "why": "在 Entra OBO 流程中，中间层只能交换**签发给它自己**的 token：assertion 的 `aud` 必须是调用方应用（这里是 `rsidc-entra-agent`）。AgentCore Runtime 也由同一个应用保护（`allowedAudience = [rsidc-entra-agent]`），因此一个 token 同时满足这两个用途。", "fix": "客户端请求 `api://<rsidc-entra-agent>/access_as_user`；`rsidc-entra-agent` 则请求 rsidc-mall-api 上的委托权限 `mcp.access`，也就是交换时所请求的权限。", "verified": "2026-10-20 记录：入站 aud = rsidc-entra-agent，scp = access_as_user；出站 aud = rsidc-mall-api，scp = mcp.access，azp = rsidc-entra-agent。", "docs": [["Microsoft Entra · On-Behalf-Of 流程", "https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-on-behalf-of-flow"], ["Microsoft Entra · access token（v2、aud、azp、roles、scp）", "https://learn.microsoft.com/en-us/entra/identity-platform/access-tokens"], ["Microsoft Entra · scope、权限与同意", "https://learn.microsoft.com/en-us/entra/identity-platform/scopes-oidc"], ["AgentCore Identity · Microsoft Entra ID", "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity-idp-microsoft.html"], ["AgentCore API · CustomJWTAuthorizerConfiguration", "https://docs.aws.amazon.com/bedrock-agentcore-control/latest/APIReference/API_CustomJWTAuthorizerConfiguration.html"]]}, {"q": "交换在哪里发生？agent 代码持有什么？", "why": "agent 调用 `GetResourceOauth2Token`，传入自己的 workload access token（绑定 agent 和当前用户）、credential provider 的**名称**以及 `oauth2Flow = ON_BEHALF_OF_TOKEN_EXCHANGE`。AgentCore Identity 使用其保存的 client secret 向 Entra 发出请求；agent 从不持有该 secret，也从不把用户的入站 token 转发给下游。", "fix": "一个 `MicrosoftOauth2` credential provider（tenant ID + rsidc-entra-agent 的 client ID / secret）；agent 只知道 provider 名称和 scopes。", "verified": "2026-10-20 记录：10/10 个 OBO 用例通过（3 个用户 × token / tools/list / 直接调用，外加 Graph /me）。", "docs": [["AgentCore Identity · on-behalf-of token 交换", "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/on-behalf-of-token-exchange.html"], ["AgentCore API · GetResourceOauth2Token", "https://docs.aws.amazon.com/bedrock-agentcore/latest/APIReference/API_GetResourceOauth2Token.html"], ["AgentCore Identity · 出站 credential provider", "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity-outbound-credential-provider.html"], ["AgentCore API · CreateOauth2CredentialProvider", "https://docs.aws.amazon.com/bedrock-agentcore-control/latest/APIReference/API_CreateOauth2CredentialProvider.html"], ["AgentCore API · MicrosoftOauth2ProviderConfigInput", "https://docs.aws.amazon.com/bedrock-agentcore-control/latest/APIReference/API_MicrosoftOauth2ProviderConfigInput.html"], ["AgentCore Identity · Microsoft Entra ID", "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity-idp-microsoft.html"]]}, {"q": "这是 RFC 8693 token exchange，还是 RFC 7523 jwt-bearer grant？", "why": "两个名称描述的是同一个思路。RFC 8693 定义了通用的 token exchange。Microsoft Entra 将 OBO 实现为 RFC 7523 jwt-bearer grant：`grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer`，用户 token 作为 `assertion`，再加上 `requested_token_use=on_behalf_of`。AgentCore 将其暴露为 `ON_BEHALF_OF_TOKEN_EXCHANGE`，并按 Microsoft provider 要求的报文格式发送。", "docs": [["RFC 8693 · OAuth 2.0 Token Exchange", "https://datatracker.ietf.org/doc/html/rfc8693"], ["RFC 7523 · JWT Profile for OAuth 2.0 Client Authentication and Authorization Grants", "https://datatracker.ietf.org/doc/html/rfc7523"], ["Microsoft Entra · On-Behalf-Of 流程", "https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-on-behalf-of-flow"], ["AgentCore Identity · on-behalf-of token 交换", "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/on-behalf-of-token-exchange.html"]]}, {"q": "为什么交换过程中没有同意提示？", "why": "OBO 在服务端运行，Entra 无法显示同意界面。如果用户或管理员尚未为 rsidc-entra-agent 同意 `mcp.access`（或 Graph `User.Read`），交换会因同意错误而失败。", "fix": "为 rsidc-entra-agent 的委托权限以及客户端的 `access_as_user` 授予租户级管理员同意（一个 `AllPrincipals` oauth2PermissionGrant）。通过 `knownClientApplications` 实现组合同意（combined consent）是另一种做法；已授予管理员同意时不需要它。", "verified": "2026-10-20 记录：面向 rsidc-mall-api 和 Graph /me 的 OBO 均在无提示的情况下返回了 token。", "docs": [["Microsoft Entra · On-Behalf-Of 流程", "https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-on-behalf-of-flow"], ["Microsoft Entra · 权限与同意概述", "https://learn.microsoft.com/en-us/entra/identity-platform/permissions-consent-overview"], ["Microsoft Entra · 授予租户级管理员同意", "https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/grant-admin-consent"], ["Microsoft Entra · scope、权限与同意", "https://learn.microsoft.com/en-us/entra/identity-platform/scopes-oidc"]]}, {"q": "用户的 App Roles 是如何进入交换后的 token 的？", "why": "Entra 为**同一个用户**和**新的资源**（rsidc-mall-api）签发 OBO token，因此会根据该用户在 rsidc-mall-api 上的 App Role 分配写入 `roles`。没 function safeRender(el, html, append) {
  const svg = el instanceof SVGElement;
  const doc = new DOMParser().parseFromString(svg ? `<svg xmlns="http://www.w3.org/2000/svg">${html}</svg>` : "<body>" + html, "text/html");
  doc.querySelectorAll("script,iframe,object,embed,link,meta,base,form").forEach(n => n.remove());
  doc.querySelectorAll("*").forEach(n => [...n.attributes].forEach(a => {
    const v = a.value.trim().toLowerCase();
    if (a.name.startsWith("on") || ((a.name === "href" || a.name === "src" || a.name === "xlink:href") && v.startsWith("javascript:"))) n.removeAttribute(a.name);
  }));
  const nodes = svg ? [...doc.querySelector("svg").childNodes] : [...doc.body.childNodes];
  append ? el.append(...nodes) : el.replaceChildren(...nodes);
}

  <div class="card"><h2>6 · 本页所模拟的两个 Web GUI</h2>${codeBlock("gui_post")}${codeBlock("gui_beforeafter")}${codeBlock("rbac_gui_login")}${codeBlock("rbac_gui_check")}
    <p class="note">RBAC GUI 退出：清除 <code>esid</code> 会话，然后调用 Entra v2 <code>/logout</code>，带上 <code>logout_hint</code> 和已注册的 <code>post_logout_redirect_uri</code>；之后 <code>POST /api/check/entra</code> 返回 401。</p></div>
  <div class="card"><h2>7 · 要点</h2><ul class="tight">

    <li>使用 <code>allowedAudience</code>，而不是 <code>allowedClients</code>：Entra v2 把客户端放在 <code>azp</code> 中。</li>
    <li>没有任何角色的用户根本不会得到该 claim → fail closed（默认拒绝）。</li>

<style>
details.codefold{margin:6px 0}
details.codefold>summary{cursor:pointer;display:inline-block;padding:3px 10px;border:1px solid #8884;border-radius:6px;
  font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:inherit;opacity:.85;user-select:none}
details.codefold>summary:hover{opacity:1}
details.codefold[open]>summary{margin-bottom:6px}
</style>
<script>
(function () {
  var CODE_FILE = /[\w./-]+\.(py|sh|js|mjs|ts|tsx|json|sql|html|md|txt|yaml|yml)(:\d+(-\d+)?)?/;
  function label(el) {
    var p = el.previousElementSibling, t = p && p.textContent.trim();
    return t && t.length < 140 && CODE_FILE.test(t) ? t : '';
  }
  function wrap(el) {
    if (el.dataset.codefold || el.closest('details.codefold')) return;
    if (el.tagName === 'PRE' && el.parentElement && el.parentElement.closest('.code')) return;  // the outer .code is wrapped
    el.dataset.codefold = '1';
    var lines = (el.textContent.replace(/\n+$/, '').match(/\n/g) || []).length + 1;
    var kind = el.classList.contains('out') ? '显示输出' : '显示代码';
    var lb = label(el);
    var d = document.createElement('details'), s = document.createElement('summary');
    d.className = 'codefold';
    s.textContent = '▸ ' + kind + (lb ? ' · ' + lb : '') + '（' + lines + ' 行）';
    el.parentNode.insertBefore(d, el);
    d.appendChild(s); d.appendChild(el);
  }
  function scan(root) {
    if (root.nodeType !== 1) return;
    if (root.matches('pre, .code')) wrap(root);
    root.querySelectorAll('pre, .code').forEach(wrap);
  }
  function start() {
    scan(document.body);
    new MutationObserver(function (ms) {
      ms.forEach(function (m) { m.addedNodes.forEach(scan); });
    }).observe(document.body, { childList: true, subtree: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
